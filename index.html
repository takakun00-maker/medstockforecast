<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八尾徳洲会総合病院 手術室 — 物品管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#080b11;color:#dde4f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.logo{font-size:40px;margin-bottom:16px;}
h1{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center;}
.sub{font-size:13px;color:#7a899e;margin-bottom:40px;text-align:center;}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.card{
  background:#0f1420;border:1px solid rgba(255,255,255,0.12);border-radius:16px;
  padding:28px 24px;width:200px;text-align:center;text-decoration:none;color:#dde4f0;
  transition:all .2s;
}
.card:hover{border-color:#3b82f6;transform:translateY(-3px);box-shadow:0 12px 40px rgba(59,130,246,.2);}
.card-icon{font-size:36px;margin-bottom:12px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.card-desc{font-size:11px;color:#7a899e;line-height:1.6;}
.footer{margin-top:40px;font-size:11px;color:#3d4f63;text-align:center;}
@media(max-width:480px){.cards{flex-direction:column;align-items:center;}.card{width:100%;max-width:300px;}}

/* ── Password Screen ── */
@keyframes gridMove{from{transform:translateY(0)}to{transform:translateY(60px)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes rotateSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scanline{0%{top:-10%}100%{top:110%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

#pwScreen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:#010409;overflow:hidden;
}
#pwScreen .bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,.12) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridMove 3s linear infinite;
}
#pwScreen .bg-fade{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 0%,transparent 40%,rgba(1,4,9,.8) 80%,#010409 100%);
}
#pwScreen .orb1{position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.18) 0%,transparent 70%);
  top:-100px;left:-100px;animation:pulse 6s ease-in-out infinite;}
#pwScreen .orb2{position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%);
  bottom:-80px;right:-80px;animation:pulse 8s ease-in-out infinite 2s;}
#pwScreen .orb3{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.1) 0%,transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 10s ease-in-out infinite 4s;}
#pwScreen .ring{position:absolute;width:600px;height:600px;
  border:1px solid rgba(59,130,246,.08);border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:rotateSlow 20s linear infinite;}
#pwScreen .ring2{position:absolute;width:800px;height:800px;
  border:1px solid rgba(139,92,246,.05);border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:rotateSlow 30s linear infinite reverse;}
#pwScreen .scanline{position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.4),transparent);
  animation:scanline 4s linear infinite;pointer-events:none;}
.pw-card{
  position:relative;z-index:2;
  background:rgba(17,21,32,.85);
  border:1px solid rgba(59,130,246,.25);border-radius:20px;
  padding:44px 40px 36px;width:360px;text-align:center;
  backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px rgba(59,130,246,.1),0 32px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
  animation:fadeUp .6s ease both;
}
.pw-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.6),transparent);}
.pw-logo-wrap{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;
  background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(139,92,246,.2));
  border:1px solid rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:0 0 24px rgba(59,130,246,.2);}
.pw-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#3b82f6;
  letter-spacing:.12em;font-family:monospace;margin-bottom:16px;
  background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);
  padding:4px 12px;border-radius:20px;}
.pw-status-dot{width:6px;height:6px;background:#10b981;border-radius:50%;
  animation:blink 1.5s ease-in-out infinite;box-shadow:0 0 6px #10b981;}
.pw-title{font-size:18px;font-weight:700;color:#e8eaf0;margin-bottom:5px;letter-spacing:.02em;}
.pw-sub{font-size:12px;color:#6b7a94;margin-bottom:28px;line-height:1.7;}
.pw-wrap{display:flex;align-items:center;background:rgba(10,13,18,.6);
  border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:0 14px;margin-bottom:12px;
  transition:border-color .2s,box-shadow .2s;}
.pw-wrap:focus-within{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 3px rgba(59,130,246,.1),0 0 20px rgba(59,130,246,.08);}
.pw-wrap input{flex:1;background:none;border:none;outline:none;color:#e8eaf0;
  font-size:16px;padding:14px 0;font-family:'Noto Sans JP',sans-serif;letter-spacing:.05em;}
.pw-wrap input::placeholder{color:#3a4155;}
.pw-eye{background:none;border:none;cursor:pointer;font-size:16px;padding:4px;color:#525d72;transition:color .15s;}
.pw-eye:hover{color:#8892a4;}
.pw-btn{width:100%;padding:14px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:500;
  letter-spacing:.06em;cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  transition:all .2s;box-shadow:0 4px 20px rgba(37,99,235,.3);position:relative;overflow:hidden;}
.pw-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(37,99,235,.45);}
.pw-btn:active{transform:translateY(0);}
.pw-err{font-size:12px;color:#ef4444;margin-top:10px;min-height:18px;font-family:monospace;}
.pw-hint{font-size:10px;color:#2a3246;margin-top:18px;letter-spacing:.06em;}
@media(max-width:480px){
  .pw-card{width:calc(100vw - 32px);padding:32px 24px 28px;}
}
</style>
</head>
<body>

<!-- ── Password Screen ── -->
<div id="pwScreen">
  <div class="bg-grid"></div>
  <div class="bg-fade"></div>
  <div class="orb1"></div><div class="orb2"></div><div class="orb3"></div>
  <div class="ring"></div><div class="ring2"></div>
  <div class="scanline"></div>
  <div class="pw-card">
    <div class="pw-logo-wrap">🏥</div>
    <div class="pw-status"><span class="pw-status-dot"></span>SECURE ACCESS</div>
    <div class="pw-title">八尾徳洲会総合病院 手術室</div>
    <div class="pw-sub">物品管理・発注支援システム<br>関係者専用ページです</div>
    <div class="pw-wrap">
      <input type="password" id="pwInput" placeholder="パスワードを入力"
        onkeydown="if(event.key==='Enter')checkPw()" autocomplete="off">
      <button class="pw-eye" onclick="toggleEye()" type="button">👁</button>
    </div>
    <button class="pw-btn" onclick="checkPw()">入室する</button>
    <div class="pw-err" id="pwErr"></div>
    <div class="pw-hint">関係者専用ページです</div>
  </div>
</div>

<div class="logo">🏥</div>
<h1>八尾徳洲会総合病院 手術室</h1>
<div class="sub">物品管理・発注支援システム</div>
<div class="cards">
  <a href="medstock.html" class="card">
    <div class="card-icon">📊</div>
    <div class="card-title">MedStock</div>
    <div class="card-desc">需要予測・在庫分析<br>手術ガントチャート<br>SPD在庫照合</div>
  </a>
  <a href="medorder.html" class="card">
    <div class="card-icon">📋</div>
    <div class="card-title">MedOrder</div>
    <div class="card-desc">発注チェックリスト<br>発注書自動生成<br>手術日別確認</div>
  </a>
</div>
<div class="footer" style="display:flex;flex-direction:column;align-items:center;gap:12px">
  <span>八尾徳洲会総合病院 手術室 専用システム</span>
  <button onclick="doLogout()" style="
    padding:8px 20px;border-radius:8px;
    background:transparent;border:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.35);font-size:11px;cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;transition:all .15s;letter-spacing:.05em;
  " onmouseover="this.style.borderColor='rgba(239,68,68,.5)';this.style.color='rgba(239,68,68,.7)'"
    onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='rgba(255,255,255,0.35)'">
    🔒 ログアウト
  </button>
</div>

<script>
var PW = 'yao890';

// 認証済みならパスワード画面をスキップ
if(sessionStorage.getItem('yao_auth') === '1'){
  document.getElementById('pwScreen').style.display = 'none';
}

function doLogout(){
  sessionStorage.removeItem('yao_auth');
  document.getElementById('pwScreen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
}
function checkPw(){
  var v = document.getElementById('pwInput').value;
  if(v === PW){
    // 認証フラグを保存（タブを閉じるまで有効）
    sessionStorage.setItem('yao_auth', '1');
    document.getElementById('pwScreen').style.display = 'none';
  } else {
    var err = document.getElementById('pwErr');
    err.textContent = 'パスワードが違います';
    document.getElementById('pwInput').value = '';
    setTimeout(function(){ err.textContent = ''; }, 2000);
  }
}
function toggleEye(){
  var inp = document.getElementById('pwInput');
  var btn = document.querySelector('.pw-eye');
  if(inp.type==='password'){ inp.type='text'; btn.textContent='🙈'; }
  else { inp.type='password'; btn.textContent='👁'; }
}
</script>
</body>
</html>
